# Self-Hosted Plane Community AIO + MinIO + MCP Stack
#
# Quick Start (Local 127.0.0.1):
#   docker compose up -d
#   Open http://127.0.0.1:8085
#
# Custom Domain / Production Deployment:
#   Override environment variables via a .env file or CI/CD environment variables (see Jenkinsfile and README.md).

services:
  plane-db:
    image: postgres:15-alpine
    container_name: plane-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${PGPASSWORD:-plane_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro

  plane-redis:
    image: redis:7-alpine
    container_name: plane-redis
    restart: always
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro

  plane-mq:
    image: rabbitmq:3-management-alpine
    container_name: plane-mq
    restart: always
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - /etc/localtime:/etc/localtime:ro

  plane-minio:
    image: cgr.dev/chainguard/minio:latest
    # Preserve access to the existing root-owned MinIO data volume.
    user: "0:0"
    container_name: plane-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  plane-minio-setup:
    # The rolling dev variant includes the shell needed for bucket initialization.
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: plane-minio-setup
    depends_on:
      - plane-minio
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempt=0
        until mc alias set myminio http://plane-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready myminio; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO did not become ready" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "myminio/$${AWS_S3_BUCKET_NAME}"
        mc anonymous set public "myminio/$${AWS_S3_BUCKET_NAME}"

  plane-mcp:
    image: ${MCP_IMAGE:-adamoutler/plane-mcp-server:plane-agent}
    container_name: plane-mcp
    restart: always
    environment:
      - PLANE_BASE_URL=${PLANE_BASE_URL:-http://127.0.0.1:8085}
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - PLANE_OAUTH_PROVIDER_CLIENT_ID=${PLANE_OAUTH_PROVIDER_CLIENT_ID:-dummy}
      - PLANE_OAUTH_PROVIDER_CLIENT_SECRET=${PLANE_OAUTH_PROVIDER_CLIENT_SECRET:-dummy}
      - PLANE_OAUTH_PROVIDER_BASE_URL=${PLANE_OAUTH_PROVIDER_BASE_URL:-http://127.0.0.1:8085/mcp/http}
      - PLANE_INTERNAL_BASE_URL=${PLANE_INTERNAL_BASE_URL:-http://plane-aio:80}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - plane-redis
      - plane-aio

  plane-aio:
    image: makeplane/plane-aio-community:stable
    container_name: plane-aio
    restart: always
    command:
      - /bin/bash
      - -ec
      - |
        sed -i \
          -e 's|update_env_value "WEB_URL" ".*"|update_env_value "WEB_URL" "$${WEB_URL:-$$app_protocol://$$DOMAIN_NAME}"|' \
          -e 's|update_env_value "CORS_ALLOWED_ORIGINS" ".*"|update_env_value "CORS_ALLOWED_ORIGINS" "$${CORS_ALLOWED_ORIGINS:-http://$$DOMAIN_NAME,https://$$DOMAIN_NAME}"|' \
          /app/start.sh
        exec /app/start.sh
    ports:
      - "${LISTEN_HTTP_PORT:-8085}:80"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-127.0.0.1}
      - WEB_URL=${WEB_URL:-http://127.0.0.1:8085}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8085,http://localhost:8085}
      - APP_PROTOCOL=${APP_PROTOCOL:-http}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-plane}:${PGPASSWORD:-plane_db_pass}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - AMQP_URL=amqp://guest:guest@plane-mq:5672/
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://127.0.0.1:8085}
      - USE_MINIO=${USE_MINIO:-1}
      - MINIO_ENDPOINT_SSL=${MINIO_ENDPOINT_SSL:-0}
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_BASE_PATH=${ADMIN_BASE_PATH:-/god-mode/}
      - GITEA_HOST=${GITEA_HOST:-}
      - GITEA_CLIENT_ID=${PLANE_FORGEJO_CLIENT_ID:-}
      - GITEA_CLIENT_SECRET=${PLANE_FORGEJO_CLIENT_SECRET:-}
      - IS_GITEA_ENABLED=${IS_GITEA_ENABLED:-0}
    volumes:
      - planedata:/app/data
      - planelogs:/app/logs
      - ./Caddyfile.fixed:/app/proxy/Caddyfile
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started
      plane-minio:
        condition: service_started
      plane-minio-setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  planedata:
  planelogs:
